[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemstone-py"
version = "0.2.8"
description = "Direct Python-to-GemStone GCI bridge and translated persistence helpers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "gemstone-py contributors"}]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/unicompute/gemstone-py"
Repository = "https://github.com/unicompute/gemstone-py"
Issues = "https://github.com/unicompute/gemstone-py/issues"
Changelog = "https://github.com/unicompute/gemstone-py/blob/main/CHANGELOG.md"
RunnerGuide = "https://github.com/unicompute/gemstone-py/blob/main/SELF_HOSTED_RUNNER.md"

[project.scripts]
gemstone-benchmark-baseline-register = "gemstone_py.benchmark_baseline_register:main_entry"
gemstone-benchmark-compare = "gemstone_py.benchmark_compare:main_entry"
gemstone-benchmarks = "gemstone_py.benchmarks:main_entry"
gemstone-examples = "gemstone_py.cli:main_entry"
gemstone-hello = "gemstone_py.cli:hello_entry"
gemstone-smalltalk-demo = "gemstone_py.cli:smalltalk_demo_entry"

[project.optional-dependencies]
dev = [
  "build>=1.0",
  "Flask>=2.3",
  "mypy>=1.10",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
]
fast = [
  "gemstone-py-native>=0.1.2",
]

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["gemstone_py*"]

[tool.setuptools.package-data]
gemstone_py = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# Porting metadata is intentionally kept immediately after module docstrings
# in translated examples and compatibility modules.
"examples/**/*.py" = ["E402", "E501"]
"gemstone_py/migrations.py" = ["E402"]
"gemstone_py/objectlog.py" = ["E402", "E501"]
"gemstone_py/ordered_collection.py" = ["E402"]

# These files contain generated/embedded content where wrapping harms readability.
"docs/build_pdf_docs.py" = ["E501"]
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = [
  "gemstone_py/__init__.py",
  "gemstone_py/aio/__init__.py",
  "gemstone_py/aio/fastapi.py",
  "gemstone_py/aio/gsquery.py",
  "gemstone_py/aio/persistent_root.py",
  "gemstone_py/api_contract.py",
  "gemstone_py/benchmark_baseline_register.py",
  "gemstone_py/benchmark_baselines.py",
  "gemstone_py/benchmark_compare.py",
  "gemstone_py/release_metadata.py",
  "gemstone_py/_smalltalk_batch.py",
  "gemstone_py/benchmarks.py",
  "gemstone_py/session_facade.py",
  "gemstone_py/example_support.py",
  "gemstone_py/cli.py",
  "gemstone_py/client.py",
  "gemstone_py/native.py",
  "gemstone_py/oop.py",
  "gemstone_py/web.py",
  "gemstone_py/persistent_root.py",
  "gemstone_py/gsquery.py",
  "gemstone_py/gstore.py",
  "gemstone_py/concurrency.py",
  "gemstone_py/objectlog.py",
  "examples/typed_access/simple_blog_queries.py",
]
follow_imports = "skip"
ignore_missing_imports = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "gemstone_py",
  "gemstone_py.api_contract",
  "gemstone_py.benchmark_baseline_register",
  "gemstone_py.benchmark_baselines",
  "gemstone_py.benchmark_compare",
  "gemstone_py.release_metadata",
  "gemstone_py._smalltalk_batch",
  "gemstone_py.benchmarks",
  "gemstone_py.session_facade",
  "gemstone_py.example_support",
  "gemstone_py.cli",
  "gemstone_py.objectlog",
]
strict = true

[[tool.mypy.overrides]]
module = [
  "gemstone_py.client",
  "gemstone_py.oop",
]
strict = true

[[tool.mypy.overrides]]
module = [
  "gemstone_py.aio",
  "gemstone_py.aio.fastapi",
  "gemstone_py.aio.gsquery",
  "gemstone_py.aio.persistent_root",
  "gemstone_py.gsquery",
  "gemstone_py.gstore",
  "gemstone_py.native",
]
strict = true

[[tool.mypy.overrides]]
module = [
  "gemstone_py.concurrency",
]
strict = true

[[tool.mypy.overrides]]
module = [
  "gemstone_py.web",
]
strict = true

[[tool.mypy.overrides]]
module = [
  "gemstone_py.persistent_root",
]
strict = true

[[tool.mypy.overrides]]
module = [
  "examples.typed_access.simple_blog_queries",
]
strict = true
