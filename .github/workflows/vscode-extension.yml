name: VS Code Extension

on:
  push:
    paths:
      - "vscode-gemstone-py-workbench/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "vscode-gemstone-py-workbench/**"
      - ".github/workflows/vscode-extension.yml"
  workflow_dispatch:
    inputs:
      publish-to-marketplace:
        description: Publish the packaged VSIX to the Visual Studio Marketplace
        required: true
        default: "false"
      create-github-release:
        description: Create or update a scoped GitHub release after Marketplace publish
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  build-vsix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-gemstone-py-workbench
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode-gemstone-py-workbench/package-lock.json

      - name: Cache VS Code test host
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: vscode-gemstone-py-workbench/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vscode-gemstone-py-workbench/package-lock.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-${{ runner.arch }}-

      - name: Install extension dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Type-check extension
        run: npm run check

      - name: Smoke-test extension helpers
        run: npm run test:smoke

      - name: Integration-test extension in VS Code
        run: xvfb-run -a npm run test:integration

      - name: Release preflight
        run: npm run release:preflight

      - name: Package VSIX
        run: npx vsce package --no-dependencies

      - name: Verify packaged VSIX
        run: npm run release:verify-vsix

      - name: Generate VSIX checksum
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          sha256sum "gemstone-py-workbench-${version}.vsix" > "gemstone-py-workbench-${version}.vsix.sha256"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gemstone-py-workbench-vsix
          path: |
            vscode-gemstone-py-workbench/*.vsix
            vscode-gemstone-py-workbench/*.vsix.sha256
          if-no-files-found: error

  publish-marketplace:
    needs: build-vsix
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs['publish-to-marketplace'] == 'true'
    defaults:
      run:
        working-directory: vscode-gemstone-py-workbench
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vscode-gemstone-py-workbench/package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gemstone-py-workbench-vsix
          path: vscode-gemstone-py-workbench

      - name: Check Marketplace version before publish
        id: marketplace-precheck
        shell: bash
        run: |
          expected_version="$(node -p "require('./package.json').version")"
          echo "visible=false" >> "${GITHUB_OUTPUT}"
          if npx vsce show unicompute.gemstone-py-workbench --json > marketplace.json; then
            if EXPECTED_VERSION="${expected_version}" node -e '
            const fs = require("fs");
            const expected = process.env.EXPECTED_VERSION;
            const payload = JSON.parse(fs.readFileSync("marketplace.json", "utf8"));
            const versions = (payload.versions || []).map((entry) => entry.version);
            if (versions.includes(expected)) {
              process.exit(0);
            }
            process.exit(1);
            '
            then
              echo "Marketplace version ${expected_version} is already visible; skipping publish."
              echo "visible=true" >> "${GITHUB_OUTPUT}"
            fi
          fi

      - name: Publish to Visual Studio Marketplace
        if: steps.marketplace-precheck.outputs.visible != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        shell: bash
        run: |
          test -n "${VSCE_PAT}"
          set +e
          publish_output="$(npx vsce publish \
            --packagePath gemstone-py-workbench-*.vsix \
            --pat "${VSCE_PAT}" \
            --no-dependencies 2>&1)"
          publish_status=$?
          set -e
          printf '%s\n' "${publish_output}"
          if test "${publish_status}" -ne 0; then
            if printf '%s\n' "${publish_output}" | grep -Eiq "already (exists|published)|version.*(exists|published)"; then
              echo "Marketplace reports this version is already published; continuing to public listing verification."
            else
              exit "${publish_status}"
            fi
          fi

      - name: Verify Marketplace version
        shell: bash
        run: |
          expected_version="$(node -p "require('./package.json').version")"
          for attempt in $(seq 1 20); do
            if npx vsce show unicompute.gemstone-py-workbench --json > marketplace.json; then
              if EXPECTED_VERSION="${expected_version}" node -e '
              const fs = require("fs");
              const expected = process.env.EXPECTED_VERSION;
              const payload = JSON.parse(fs.readFileSync("marketplace.json", "utf8"));
              const versions = (payload.versions || []).map((entry) => entry.version);
              if (payload.displayName !== "gemstone-py Workbench") {
                throw new Error(`Unexpected Marketplace display name: ${payload.displayName}`);
              }
              if (!versions.includes(expected)) {
                throw new Error(`Marketplace versions ${versions.join(", ")} do not include ${expected}`);
              }
              if (versions[0] !== expected) {
                throw new Error(`Marketplace latest version is ${versions[0]}, expected ${expected}`);
              }
              '
              then
                echo "Marketplace version ${expected_version} is visible."
                exit 0
              fi
            fi
            echo "Marketplace version ${expected_version} not visible yet; retrying (${attempt}/20)..."
            sleep 60
          done
          echo "Marketplace version ${expected_version} did not become visible."
          exit 1

  github-release:
    needs:
      - build-vsix
      - publish-marketplace
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs['publish-to-marketplace'] == 'true' &&
      github.event.inputs['create-github-release'] == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download VSIX artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: gemstone-py-workbench-vsix
          path: vscode-gemstone-py-workbench

      - name: Resolve release metadata
        id: release-metadata
        shell: bash
        run: |
          version="$(node -p "require('./vscode-gemstone-py-workbench/package.json').version")"
          tag="vscode-workbench-v${version}"
          vsix="vscode-gemstone-py-workbench/gemstone-py-workbench-${version}.vsix"
          checksum="vscode-gemstone-py-workbench/gemstone-py-workbench-${version}.vsix.sha256"
          test -f "${vsix}"
          test -f "${checksum}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "vsix=${vsix}" >> "${GITHUB_OUTPUT}"
          echo "checksum=${checksum}" >> "${GITHUB_OUTPUT}"

      - name: Create release notes
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          changelog_notes="$(
            awk -v version="${RELEASE_VERSION}" '
              $0 == "## " version { capture=1; next }
              /^## / && capture { exit }
              capture { print }
            ' vscode-gemstone-py-workbench/CHANGELOG.md
          )"
          {
            echo "VS Code workbench ${RELEASE_VERSION}."
            echo
            echo "Marketplace: https://marketplace.visualstudio.com/items?itemName=unicompute.gemstone-py-workbench"
            echo "Workflow: ${RUN_URL}"
            echo
            echo "## Changelog"
            echo
            if test -n "${changelog_notes}"; then
              printf '%s\n' "${changelog_notes}"
            else
              echo "See vscode-gemstone-py-workbench/CHANGELOG.md for release notes."
            fi
          } > vscode-workbench-release-notes.md

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release-metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
          VSIX_PATH: ${{ steps.release-metadata.outputs.vsix }}
          CHECKSUM_PATH: ${{ steps.release-metadata.outputs.checksum }}
        run: |
          git fetch --force origin "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}" || true
          if ! git rev-parse --verify --quiet "${RELEASE_TAG}" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" -m "VS Code workbench ${RELEASE_VERSION}"
            git push origin "${RELEASE_TAG}"
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "VS Code workbench ${RELEASE_VERSION}" \
              --notes-file vscode-workbench-release-notes.md
            gh release upload "${RELEASE_TAG}" "${VSIX_PATH}" "${CHECKSUM_PATH}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${VSIX_PATH}" "${CHECKSUM_PATH}" \
              --title "VS Code workbench ${RELEASE_VERSION}" \
              --notes-file vscode-workbench-release-notes.md
          fi
