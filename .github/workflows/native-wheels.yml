name: Native Wheels

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Optional native release tag to validate against gemstone-py-native project.version
        required: false
        default: ""
      publish-to-testpypi:
        description: Set to true to publish native wheels to TestPyPI
        required: true
        default: "false"
      publish-to-pypi:
        description: Set to true to publish native wheels to PyPI
        required: true
        default: "false"
  push:
    paths:
      - "gemstone-py-native/**"
      - ".github/workflows/native-wheels.yml"
  pull_request:
    paths:
      - "gemstone-py-native/**"
      - ".github/workflows/native-wheels.yml"

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.native-metadata.outputs.version }}
      normalized-tag: ${{ steps.native-metadata.outputs.normalized_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Read native package metadata
        id: native-metadata
        shell: bash
        env:
          WORKFLOW_RELEASE_TAG: ${{ github.event.inputs['release-tag'] }}
          WORKFLOW_PUBLISH_TO_PYPI: ${{ github.event.inputs['publish-to-pypi'] }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          def normalize_native_tag(tag):
              normalized = tag.removeprefix("refs/tags/").strip()
              for prefix in ("gemstone-py-native-", "native-", "v"):
                  if normalized.startswith(prefix):
                      normalized = normalized.removeprefix(prefix)
              return normalized

          pyproject = tomllib.loads(
              Path("gemstone-py-native/pyproject.toml").read_text(encoding="utf-8")
          )
          version = pyproject["project"]["version"]
          release_tag = os.environ.get("WORKFLOW_RELEASE_TAG", "").strip()
          publish_to_pypi = os.environ.get("WORKFLOW_PUBLISH_TO_PYPI") == "true"
          if publish_to_pypi and not release_tag:
              raise SystemExit("Manual native PyPI publish requires the release-tag input.")
          normalized_tag = normalize_native_tag(release_tag) if release_tag else ""
          if normalized_tag and normalized_tag != version:
              raise SystemExit(
                  f"Native release tag {release_tag!r} does not match project.version {version!r}"
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write(f"version={version}\n")
              stream.write(f"normalized_tag={normalized_tag}\n")
          PY

  build:
    needs: metadata
    name: Build ${{ matrix.platform }} wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            wheel-markers: manylinux,x86_64
            rust-target: ""
            import-smoke: "true"
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            wheel-markers: manylinux,aarch64
            rust-target: ""
            import-smoke: "true"
          - platform: linux-armv7l
            os: ubuntu-24.04
            wheel-markers: manylinux,armv7l
            rust-target: armv7-unknown-linux-gnueabihf
            import-smoke: "false"
            binary-markers: ARM,EABI5
          - platform: macos-x86_64
            os: macos-15-intel
            wheel-markers: macosx,x86_64
            rust-target: ""
            import-smoke: "true"
          - platform: macos-aarch64
            os: macos-latest
            wheel-markers: macosx,arm64
            rust-target: ""
            import-smoke: "true"
          - platform: windows-x86_64
            os: windows-latest
            wheel-markers: win_amd64
            rust-target: ""
            import-smoke: "true"
          - platform: windows-aarch64
            os: windows-11-arm
            wheel-markers: win_arm64
            rust-target: ""
            import-smoke: "true"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          rustup toolchain install stable --profile minimal
          if [[ -n "${RUST_TARGET}" ]]; then
            rustup target add "${RUST_TARGET}"
          fi

      - name: Install maturin
        shell: bash
        run: |
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            python -m pip install "maturin[zig]>=1.7,<2"
          else
            python -m pip install "maturin>=1.7,<2"
          fi

      - name: Build wheels
        shell: bash
        env:
          RUST_TARGET: ${{ matrix.rust-target }}
        run: |
          args=(
            --release
            --compatibility pypi
            --manifest-path gemstone-py-native/Cargo.toml
            --out dist
          )
          if [[ "${RUNNER_OS}" == "Linux" ]]; then
            args+=(--zig)
          fi
          if [[ -n "${RUST_TARGET}" ]]; then
            args+=(--target "${RUST_TARGET}")
          fi
          python -m maturin build "${args[@]}"

      - name: Verify ${{ matrix.platform }} wheel artifact
        shell: bash
        env:
          EXPECTED_WHEEL_MARKERS: ${{ matrix.wheel-markers }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          wheels = sorted(Path("dist").glob("gemstone_py_native-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one native wheel, got {wheels!r}")

          wheel_name = wheels[0].name
          if "cp311-abi3" not in wheel_name:
              raise SystemExit(f"Native wheel is not abi3 tagged: {wheel_name}")

          markers = [
              marker.strip()
              for marker in os.environ["EXPECTED_WHEEL_MARKERS"].split(",")
              if marker.strip()
          ]
          missing = [marker for marker in markers if marker not in wheel_name]
          if missing:
              raise SystemExit(
                  f"Native wheel {wheel_name!r} is missing expected markers {missing!r}"
              )
          PY

      - name: Verify ${{ matrix.platform }} wheel import
        if: matrix.import-smoke == 'true'
        shell: bash
        run: |
          python -m pip install --no-deps --target native-wheel-smoke dist/*.whl
          python - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("native-wheel-smoke").resolve()))
          os.environ["GEMSTONE_PY_GCI_BACKEND"] = "native"

          import gemstone_py._gci as gci

          if gci.IMPLEMENTATION != "native":
              raise SystemExit(f"Expected native backend, got {gci.IMPLEMENTATION!r}")
          if gci._smallint_to_python(gci._python_to_smallint(-42)) != -42:
              raise SystemExit("Native smallint helper round trip failed")
          PY

      - name: Verify ${{ matrix.platform }} cross-compiled wheel binary
        if: matrix.import-smoke != 'true'
        shell: bash
        env:
          EXPECTED_BINARY_MARKERS: ${{ matrix.binary-markers }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("gemstone_py_native-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one native wheel, got {wheels!r}")

          extract_root = Path("cross-wheel-smoke")
          with zipfile.ZipFile(wheels[0]) as archive:
              archive.extractall(extract_root)
          extensions = sorted(extract_root.glob("**/*.so"))
          if len(extensions) != 1:
              raise SystemExit(f"Expected one native extension in wheel, got {extensions!r}")

          report = subprocess.check_output(["file", str(extensions[0])], text=True)
          markers = [
              marker.strip()
              for marker in os.environ["EXPECTED_BINARY_MARKERS"].split(",")
              if marker.strip()
          ]
          missing = [marker for marker in markers if marker not in report]
          if missing:
              raise SystemExit(
                  f"Native extension {extensions[0]} missing binary markers {missing!r}: {report}"
              )
          print(report)
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gemstone-py-native-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  sdist:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install stable --profile minimal

      - name: Install maturin
        run: python -m pip install "maturin>=1.7,<2"

      - name: Build sdist
        run: python -m maturin sdist --manifest-path gemstone-py-native/Cargo.toml --out dist

      - name: Verify native sdist builds a wheel
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          import sys
          import tarfile
          from pathlib import Path

          archives = sorted(Path("dist").glob("gemstone_py_native-*.tar.gz"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one native sdist archive, got {archives!r}")

          extract_root = Path("sdist-src")
          with tarfile.open(archives[0]) as archive:
              archive.extractall(extract_root)

          manifests = sorted(extract_root.glob("*/Cargo.toml"))
          if len(manifests) != 1:
              raise SystemExit(f"Expected one native Cargo.toml from sdist, got {manifests!r}")

          subprocess.run(
              [
                  sys.executable,
                  "-m",
                  "maturin",
                  "build",
                  "--manifest-path",
                  str(manifests[0]),
                  "--out",
                  "sdist-wheel",
              ],
              check=True,
          )
          wheels = sorted(Path("sdist-wheel").glob("gemstone_py_native-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"Expected one native sdist-built wheel, got {wheels!r}")
          wheel_name = wheels[0].name
          if "cp311-abi3" not in wheel_name:
              raise SystemExit(f"Native sdist-built wheel is not abi3 tagged: {wheel_name}")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gemstone-py-native-sdist
          path: dist/*
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-sdist-build-smoke
          path: sdist-wheel/*
          if-no-files-found: error

  publish-testpypi:
    needs:
      - metadata
      - build
      - sdist
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs['publish-to-testpypi'] == 'true'
    permissions:
      id-token: write
    environment:
      name: testpypi
    env:
      NATIVE_VERSION: ${{ needs.metadata.outputs.package-version }}
      TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gemstone-py-native-*
          path: dist
          merge-multiple: true

      - name: Verify native TestPyPI publish artifacts
        run: |
          python -m gemstone_py.release_metadata \
            --native-artifacts-dir dist \
            --native-version "${NATIVE_VERSION}" \
            --json > native-publish-artifacts.json
          cat native-publish-artifacts.json

      - name: Publish native wheels to TestPyPI with API token
        if: env.TEST_PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          password: ${{ env.TEST_PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false

      - name: Publish native wheels to TestPyPI with trusted publishing
        if: env.TEST_PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  verify-testpypi-install:
    needs:
      - metadata
      - publish-testpypi
    runs-on: ubuntu-latest
    env:
      NATIVE_VERSION: ${{ needs.metadata.outputs.package-version }}
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install native package from TestPyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          installed=0
          for attempt in 1 2 3 4 5 6; do
            if python -m pip install \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "gemstone-py-native==${NATIVE_VERSION}"; then
              installed=1
              break
            fi
            echo "TestPyPI native package not available yet; retrying (${attempt}/6)..."
            python -m pip uninstall -y gemstone-py-native >/dev/null 2>&1 || true
            sleep 30
          done
          if [[ "${installed}" != "1" ]]; then
            echo "Failed to install gemstone-py-native==${NATIVE_VERSION} from TestPyPI."
            exit 1
          fi

      - name: Verify native package import
        run: |
          python - <<'PY'
          import gemstone_py._gci as gci

          if gci.IMPLEMENTATION != "native":
              raise SystemExit(f"Expected native backend, got {gci.IMPLEMENTATION!r}")
          if gci._smallint_to_python(gci._python_to_smallint(-42)) != -42:
              raise SystemExit("Native smallint helper round trip failed")
          PY

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify TestPyPI native files and metadata
        env:
          NATIVE_PYPI_JSON_URL: https://test.pypi.org/pypi/gemstone-py-native/json
        run: |
          python -m gemstone_py.release_metadata \
            --native-pypi-json-url "${NATIVE_PYPI_JSON_URL}" \
            --native-version "${NATIVE_VERSION}" \
            --json > native-pypi-release.json
          cat native-pypi-release.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gemstone-py-native-testpypi-verify
          path: native-pypi-release.json
          if-no-files-found: error

  publish-pypi:
    needs:
      - metadata
      - build
      - sdist
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs['publish-to-pypi'] == 'true'
    permissions:
      id-token: write
    environment:
      name: pypi
    env:
      NATIVE_VERSION: ${{ needs.metadata.outputs.package-version }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: gemstone-py-native-*
          path: dist
          merge-multiple: true

      - name: Verify native PyPI publish artifacts
        run: |
          python -m gemstone_py.release_metadata \
            --native-artifacts-dir dist \
            --native-version "${NATIVE_VERSION}" \
            --json > native-publish-artifacts.json
          cat native-publish-artifacts.json

      - name: Publish native wheels to PyPI with API token
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist
          password: ${{ env.PYPI_API_TOKEN }}
          attestations: false

      - name: Publish native wheels to PyPI with trusted publishing
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist

  verify-pypi-install:
    needs:
      - metadata
      - publish-pypi
    runs-on: ubuntu-latest
    env:
      NATIVE_VERSION: ${{ needs.metadata.outputs.package-version }}
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Install native package from PyPI
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "gemstone-py-native==${NATIVE_VERSION}"

      - name: Verify native package import
        run: |
          python - <<'PY'
          import gemstone_py._gci as gci

          if gci.IMPLEMENTATION != "native":
              raise SystemExit(f"Expected native backend, got {gci.IMPLEMENTATION!r}")
          if gci._smallint_to_python(gci._python_to_smallint(-42)) != -42:
              raise SystemExit("Native smallint helper round trip failed")
          PY

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Verify PyPI native files and metadata
        env:
          NATIVE_PYPI_JSON_URL: https://pypi.org/pypi/gemstone-py-native/json
        run: |
          python -m gemstone_py.release_metadata \
            --native-pypi-json-url "${NATIVE_PYPI_JSON_URL}" \
            --native-version "${NATIVE_VERSION}" \
            --json > native-pypi-release.json
          cat native-pypi-release.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gemstone-py-native-pypi-verify
          path: native-pypi-release.json
          if-no-files-found: error
